---
# =============================================================================
# Host prep only — Komodo owns the deploy (image pull via group registry account +
# compose up reconciled from homelab-gitops, including the dedicated kandidat-db).
# We deliberately do NOT docker_login here and do NOT run docker compose. Ansible
# just creates the bind-mount data dir with the ownership the non-root container expects.
# =============================================================================
- name: Create kandidat data directory (writable by the container UID)
  ansible.builtin.file:
    path: "{{ kandidat_data_dir }}"
    state: directory
    owner: "{{ kandidat_uid }}"
    group: "{{ kandidat_gid }}"
    mode: '0755'
