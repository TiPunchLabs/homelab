---
- name: Configure bastion-60
  become: true
  hosts:
    - bastion
  roles:
    - role: motd
      tags:
        - motd
    - role: security_hardening
      tags:
        - security-hardening
    # ssh_keys AVANT tooling : le clone du depot passe desormais par SSH, il a
    # donc besoin de la cle privee et des cles d'hote de gitlab.com. L'ordre
    # inverse fonctionnait tant que le clone etait en HTTPS anonyme.
    - role: ssh_keys
      tags:
        - ssh-keys
    - role: tooling
      tags:
        - tooling
    - role: gitlab_runner
      tags:
        - gitlab-runner
