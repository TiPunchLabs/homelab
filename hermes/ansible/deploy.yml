---
- name: Configure hermes-30
  become: true
  hosts:
    - hermes
  pre_tasks:
    # Hermes planifie ses taches en heure locale : le fuseau ne doit pas
    # dependre d'un geste manuel non rejoue.
    - name: Recuperer le fuseau horaire courant
      ansible.builtin.command: timedatectl show -p Timezone --value
      register: hermes_current_timezone
      changed_when: false
      tags:
        - motd
        - security-hardening
        - docker
        - hermes
        - komodo-periphery

    - name: Definir le fuseau horaire sur {{ hermes_timezone }}
      ansible.builtin.command: timedatectl set-timezone {{ hermes_timezone }}
      when: hermes_current_timezone.stdout != hermes_timezone
      changed_when: true
      tags:
        - motd
        - security-hardening
        - docker
        - hermes
        - komodo-periphery
  roles:
    - role: motd
      tags:
        - motd
    - role: security_hardening
      tags:
        - security-hardening
    - role: docker
      tags:
        - docker
    # Apres security_hardening : la regle UFW du dashboard doit exister avant
    # que Caddy tente de le joindre.
    - role: hermes_agent
      tags:
        - hermes
    # Apres hermes_agent : l'agent Komodo observe la stack Hermes, autant
    # qu'elle existe avant qu'il ne se connecte. Il n'en depend pas
    # techniquement — le socket est monte en lecture seule, Periphery ne fait
    # que la voir.
    - role: komodo_periphery
      tags:
        - komodo-periphery
