---
# Lecture seule : jouable a tout moment, y compris avant m5-backup.yml.
#   ansible-playbook ansible/m5-preflight.yml [-e hermes_m5_backup_id=AAAAMMJJTHHMM]
# Avec l'identifiant prevu, verifie aussi qu'aucune sauvegarde ne le porte.
# Ne jamais passer hermes_default_profile ni un seuil en -e.
- name: Preflight M5 (v0.20.4, historique) — LECTURE SEULE (default avant Nora, Kaféine, Néo, Scout)
  hosts: hermes
  become: true
  gather_facts: false
  pre_tasks:
    - name: Run legacy_v0204_guard.yml
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: legacy_v0204_guard.yml
      tags:
        - always
  tasks:
    - name: Run preflight.yml
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: preflight.yml

    - name: Run deployed_profiles_preflight.yml (cafe-ia, tech-watch, job-search)
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: deployed_profiles_preflight.yml

    - name: Run m5_preflight.yml
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: m5_preflight.yml
