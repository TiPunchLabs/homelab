---
# Lecture seule : jouable a tout moment, y compris avant --check.
#   ansible-playbook ansible/m2-preflight.yml
# Resoudre la declaration exige les cles vault de Kaféine : leur absence est
# un NO-GO voulu (jeton absent = profil non activable).
- name: Preflight M2 de hermes-30 — LECTURE SEULE (default, cron, profil cafe-ia)
  hosts: hermes
  become: true
  gather_facts: false
  tasks:
    - name: Run preflight.yml
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: preflight.yml

    - name: Run profile_preflight.yml for cafe-ia
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: profile_preflight.yml
      vars:
        hermes_pf_profile: "{{ hermes_profile_cafe_ia }}"
