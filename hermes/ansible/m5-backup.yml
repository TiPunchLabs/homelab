---
# Sauvegarde M5 de default, a chaud, sans arret ni redemarrage. Ecrit
# UNIQUEMENT sous hermes_m5_backup_root/<id> (root, 0700) ; refuse d'ecraser.
# Jamais joue par deploy.yml. Apres un m5-preflight.yml GO :
#   ansible-playbook ansible/m5-backup.yml -e hermes_m5_backup_id=AAAAMMJJTHHMM
- name: Sauvegarde M5 de hermes-30 (default avant Nora)
  hosts: hermes
  become: true
  gather_facts: false
  tasks:
    - name: Run m5_preflight.yml
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: m5_preflight.yml

    - name: Run m5_backup.yml
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: m5_backup.yml
