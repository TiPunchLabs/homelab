---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Reset UFW rules
  community.general.ufw:
    state: reset

- name: Set default incoming policy to deny
  community.general.ufw:
    direction: incoming
    default: "{{ security_ufw_default_incoming }}"

- name: Set default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    default: "{{ security_ufw_default_outgoing }}"

# `src` est optionnel : sans lui, la regle reste ouverte a tous (`any`), soit
# le comportement anterieur. Avec, elle est restreinte a une source unique —
# indispensable pour le dashboard Hermes, joignable par le seul reverse proxy.
- name: Open required ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.src | default('any') }}"
    comment: "{{ item.comment }}"
  loop: "{{ security_open_ports }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
