---
# LECTURE SEULE : la gateway d'un profil supplementaire est-elle supervisee et
# connectee a Telegram (niveaux 1-3) ? Echoue sinon.
#
# Entree : hermes_tc_profile_name (ex. cafe-ia). Sert apres un rollback, pour
# prouver qu'arreter un profil n'a pas emporte les autres.

- name: Verify the Telegram connection (levels 1-3) of {{ hermes_tc_profile_name }}
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -u
      - "{{ hermes_puid }}"
      - hermes
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', 'hermes_checks.py') }}"
      - telegram
      - "/opt/data/profiles/{{ hermes_tc_profile_name }}/gateway_state.json"
      - "gateway-{{ hermes_tc_profile_name }}"
  register: hermes_tc_telegram
  changed_when: false
  check_mode: false

- name: Report the gateway state of {{ hermes_tc_profile_name }}
  ansible.builtin.debug:
    msg: "{{ hermes_tc_profile_name }} : {{ hermes_tc_telegram.stdout | trim }}"
