---
# =============================================================================
# Garde-fous joues cote CONTROLEUR, avant la moindre ecriture sur l'hote.
#
# Tout echoue ferme : une liste blanche vide, un jeton manquant ou partage, un
# port en double arretent le playbook avant qu'un fichier ne bouge.
#
# Les assertions portent sur des INDEX, jamais sur l'element : un echec de
# boucle afficherait le dictionnaire du profil, jeton compris. Celles qui
# manipulent un jeton sont en no_log ; le nom de la tache suffit a comprendre.
# =============================================================================

- name: Assert that hermes_profiles is a list
  ansible.builtin.assert:
    that:
      - hermes_profiles is sequence
      - hermes_profiles is not string
      - hermes_profiles is not mapping
    fail_msg: "hermes_profiles doit etre une liste (vide tant qu'aucun profil n'est deploye)."
    quiet: true

# Une chaine "false" serait vraie en Jinja : le chemin multiplexe partirait
# sur une image v0.20.4, ou l'inverse.
- name: Assert that hermes_gateway_multiplex is a boolean
  ansible.builtin.assert:
    that:
      - hermes_gateway_multiplex is boolean
    fail_msg: "hermes_gateway_multiplex doit etre un booleen (true : Hermes v0.22, une gateway multiplexee)."
    quiet: true

# La liste blanche vit dans la couche managed et s'impose aux bots de TOUS
# les profils. Vide, Hermes retomberait sur l'appairage : n'importe qui
# connaissant un bot obtiendrait un code.
- name: Assert that the Telegram allowlist is set
  ansible.builtin.assert:
    that:
      - hermes_telegram_allowed_users | string | trim | length > 0
      - hermes_telegram_allowed_users | string is match('^\s*[0-9]+(\s*,\s*[0-9]+)*\s*$')
    fail_msg: >-
      hermes_telegram_allowed_users doit lister des identifiants Telegram
      numeriques separes par des virgules : sans liste blanche, les bots
      s'ouvrent a l'appairage.
    quiet: true
  when: hermes_telegram_enabled or hermes_profiles | length > 0

- name: Assert that the default profile has its Telegram bot token
  ansible.builtin.assert:
    that:
      - hermes_telegram_bot_token | default('') | string | length > 0
    quiet: true
  when: hermes_telegram_enabled
  no_log: true

- name: Validate each profile definition
  ansible.builtin.assert:
    that:
      - hermes_profiles[idx] is mapping
      - hermes_profiles[idx].name | default('') is match('^[a-z0-9][a-z0-9_-]*$')
      - hermes_profiles[idx].name != 'default'
      # Ports figes par profil, pas par ordre de deploiement.
      - hermes_profiles[idx].name in hermes_profile_reserved_ports
      - (hermes_profiles[idx].api_server_port | default(0) | int)
        == (hermes_profile_reserved_ports[hermes_profiles[idx].name] | default(-1) | int)
      # La liste blanche est globale (couche managed) : une valeur par profil
      # serait ignoree sans bruit, puisque le managed gagne.
      - hermes_profiles[idx].telegram_allowed_users is not defined
      # Ces cles passent par leurs champs dedies ou par le managed. API_SERVER_*
      # en entier : la cle d'API vient du managed seul (cf. hermes_checks.py
      # api_key_errors), un port ou un hote par profil passent par
      # api_server_port et le bind loopback par defaut.
      - hermes_profiles[idx].env | default({}) | dict2items | map(attribute='key')
        | select('match', '^(TELEGRAM_|API_SERVER_|GATEWAY_ALLOW)') | list | length == 0
      # Nom du bot (public, pas un secret) : controle par getMe avant le
      # demarrage du gateway. Convention D2 : <assistant>_<6 alphanum>_bot.
      - hermes_profiles[idx].telegram_bot_username is not defined
        or hermes_profiles[idx].telegram_bot_username is match('^[a-z]+_[A-Za-z0-9]{6}_bot$')
      # Rend TOUTES les valeurs de config : le templating paresseux ne les
      # resout sinon qu'au `config set` de profile.yml, profil deja cree. Une
      # cle vault absente (contexte prive, par exemple) echoue ici, avant
      # toute ecriture. Le resultat n'est jamais affiche.
      - hermes_profiles[idx].config | default({}) | to_json is string
      # Une cle masquee mal orthographiee ne masquerait rien, sans bruit.
      - hermes_profiles[idx].config_no_log | default([]) is sequence
      - hermes_profiles[idx].config_no_log | default([]) is not string
      - hermes_profiles[idx].config_no_log | default([])
        | difference(hermes_profiles[idx].config | default({}) | list) | length == 0
    fail_msg: >-
      Profil n°{{ idx }} invalide : nom [a-z0-9_-] autre que default et present
      dans hermes_profile_reserved_ports, api_server_port egal a son port
      reserve, pas de telegram_allowed_users (liste blanche globale), aucune
      cle TELEGRAM_* / API_SERVER_* / GATEWAY_ALLOW* dans env,
      telegram_bot_username au format <assistant>_<6 alphanum>_bot,
      config_no_log limite a des cles de config.
    quiet: true
  loop: "{{ range(hermes_profiles | length) | list }}"
  loop_control:
    loop_var: idx
    label: "{{ idx }}"

- name: Assert that each profile has its own Telegram bot token
  ansible.builtin.assert:
    that:
      - hermes_profiles[idx].telegram_bot_token | default('') | string | length > 0
    fail_msg: "Profil n°{{ idx }} sans telegram_bot_token."
    quiet: true
  loop: "{{ range(hermes_profiles | length) | list }}"
  loop_control:
    loop_var: idx
    label: "{{ idx }}"
  no_log: true

# Une valeur vide retirerait la cle sans bruit (env_keys.yml : vide = retiree) :
# un profil deploye sans sa cle de recherche web, par exemple.
- name: Assert that each profile env value is set
  ansible.builtin.assert:
    that:
      - hermes_profiles[idx].env | default({}) | dict2items | map(attribute='value')
        | map('string') | map('trim') | select('equalto', '') | list | length == 0
    fail_msg: "Profil n°{{ idx }} : une cle de env est vide."
    quiet: true
  loop: "{{ range(hermes_profiles | length) | list }}"
  loop_control:
    loop_var: idx
    label: "{{ idx }}"
  no_log: true

- name: Assert that profile names and API ports are unique
  ansible.builtin.assert:
    that:
      - hermes_profile_reserved_ports.values() | map('int') | unique | length == hermes_profile_reserved_ports | length
      - hermes_profile_names | unique | length == hermes_profile_names | length
      - hermes_ports_in_use | unique | length == hermes_ports_in_use | length
    fail_msg: "Deux profils (default compris) partagent un nom ou un port d'API."
    quiet: true
  vars:
    hermes_profile_names: "{{ hermes_profiles | map(attribute='name') | list }}"
    hermes_ports_in_use: >-
      {{ [hermes_gateway_port | int]
         + (hermes_profiles | map(attribute='api_server_port') | map('int') | list) }}

# Deux gateways avec le meme jeton : `gateway run --replace` tue le detenteur
# du verrou, meme s'il appartient a un autre profil.
- name: Assert that no two profiles share a Telegram bot token
  ansible.builtin.assert:
    that:
      - hermes_telegram_tokens_in_use | unique | length == hermes_telegram_tokens_in_use | length
    quiet: true
  vars:
    hermes_telegram_tokens_in_use: >-
      {{ ([hermes_telegram_bot_token if hermes_telegram_enabled else '']
          + (hermes_profiles | map(attribute='telegram_bot_token', default='') | list))
         | select | list }}
  no_log: true

# =============================================================================
# Identite declaree du profil default (hermes_default_profile, M5 Nora).
# Vide : rien a valider, default reste tel qu'il tourne.
# =============================================================================
- name: Validate the default profile declaration
  ansible.builtin.assert:
    that:
      - hermes_default_profile is mapping
      - hermes_default_profile | list | difference(['soul_predecessor_sha256', 'env', 'config', 'config_no_log']) | length == 0
      # Rend TOUTES les valeurs : une cle vault ou un prerequis absent echoue
      # ici, avant toute ecriture. Le resultat n'est jamais affiche.
      - hermes_default_profile | to_json is string
      - hermes_default_profile.soul_predecessor_sha256 | default('') is match('^[0-9a-f]{64}$')
      # Le jeton et le port de default restent ceux de main.yml ; l'API
      # vient du managed.
      - hermes_default_profile.env | default({}) | dict2items | map(attribute='key')
        | select('match', '^(TELEGRAM_|API_SERVER_|GATEWAY_ALLOW)') | list | length == 0
      # De mcp_servers, seul l'interrupteur `enabled` est gere : url, commande
      # ou en-tetes ne passent jamais par le depot.
      - hermes_default_profile.config | default({}) | list | select('match', '^mcp_servers\.')
        | reject('match', '^mcp_servers\.[A-Za-z0-9_-]+\.enabled$') | list | length == 0
      # Le fournisseur et le modele sont epingles dans le managed.
      - hermes_default_profile.config | default({}) | list | select('match', '^(model|providers)\.') | list | length == 0
      - hermes_default_profile.config_no_log | default([]) is sequence
      - hermes_default_profile.config_no_log | default([]) is not string
      - hermes_default_profile.config_no_log | default([])
        | difference(hermes_default_profile.config | default({}) | list) | length == 0
    fail_msg: >-
      hermes_default_profile invalide : cles autorisees soul_predecessor_sha256
      (64 hex), env, config, config_no_log ; aucune cle TELEGRAM_* /
      API_SERVER_* / GATEWAY_ALLOW* dans env ; de mcp_servers, seule
      <serveur>.enabled ; ni model.* ni providers.* ; prerequis M5.4 poses.
    quiet: true
  when: hermes_default_profile | length > 0

- name: Assert that each default profile env value is set
  ansible.builtin.assert:
    that:
      - hermes_default_profile.env | default({}) | dict2items | map(attribute='value')
        | map('string') | map('trim') | select('equalto', '') | list | length == 0
    fail_msg: "hermes_default_profile : une cle de env est vide."
    quiet: true
  when: hermes_default_profile | length > 0
  no_log: true

# Une cle de recherche par assistant : quota, revocation et fuite restent
# separes. Comparees sans jamais etre affichees.
- name: Assert that the default profile does not reuse a profile web search key
  ansible.builtin.assert:
    that:
      - hermes_default_profile.env.TAVILY_API_KEY
        not in (hermes_profiles | map(attribute='env', default={}) | map(attribute='TAVILY_API_KEY', default='') | list)
    quiet: true
  when:
    - hermes_default_profile | length > 0
    - hermes_default_profile.env.TAVILY_API_KEY is defined
  no_log: true
