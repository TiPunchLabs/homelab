---
# Un profil : creation, contenu livre, cles .env, cles config, gateway.
# Appele en boucle par profiles.yml, qui a deja verifie les garde-fous.

- name: "Create the profile {{ hermes_profile.name }}"
  ansible.builtin.command:
    # --no-alias : le wrapper ~/.local/bin/<name> atterrirait dans un $HOME
    # ephemere du conteneur.
    argv: >-
      {{ ['docker', 'exec', '-u', hermes_puid | string, 'hermes',
          'hermes', 'profile', 'create', hermes_profile.name, '--no-alias']
         + (['--description', hermes_profile.description]
            if hermes_profile.description | default('') else []) }}
    creates: "{{ hermes_data_dir }}/profiles/{{ hermes_profile.name }}"

# Ansible possede les fichiers qu'il livre (SOUL.md, scripts/) et eux seuls :
# copy n'efface rien, l'agent garde ses propres fichiers a cote.
- name: "Deploy the content of profile {{ hermes_profile.name }}"
  ansible.builtin.copy:
    src: "profiles/{{ hermes_profile.name }}/"
    dest: "{{ hermes_data_dir }}/profiles/{{ hermes_profile.name }}/"
    owner: "{{ hermes_puid }}"
    group: "{{ hermes_pgid }}"
    mode: '0644'
    directory_mode: '0755'

- name: "Pin the .env keys of profile {{ hermes_profile.name }}"
  ansible.builtin.lineinfile:
    path: "{{ hermes_data_dir }}/profiles/{{ hermes_profile.name }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    state: "{{ 'present' if item.value | string | length > 0 else 'absent' }}"
    create: true
    owner: "{{ hermes_puid }}"
    group: "{{ hermes_pgid }}"
    mode: '0600'
  loop: "{{ hermes_profile_env | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    hermes_profile_env: >-
      {{ {'TELEGRAM_BOT_TOKEN': hermes_profile.telegram_bot_token | default(''),
          'TELEGRAM_ALLOWED_USERS': hermes_profile.telegram_allowed_users | default(''),
          'API_SERVER_PORT': hermes_profile.api_server_port | string}
         | combine(hermes_profile.env | default({})) }}
  no_log: true
  register: hermes_profile_env_result

- name: "Read the config keys of profile {{ hermes_profile.name }}"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -u
      - "{{ hermes_puid }}"
      - hermes
      - hermes
      - -p
      - "{{ hermes_profile.name }}"
      - config
      - get
      - "{{ item.key }}"
  loop: "{{ hermes_profile.config | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: hermes_profile_config_current
  changed_when: false
  # rc=1 : cle absente, donc a poser.
  failed_when: hermes_profile_config_current.rc not in [0, 1]
  when: not ansible_check_mode

- name: "Set the config keys of profile {{ hermes_profile.name }}"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -u
      - "{{ hermes_puid }}"
      - hermes
      - hermes
      - -p
      - "{{ hermes_profile.name }}"
      - config
      - set
      - "{{ item.item.key }}"
      - "{{ item.item.value | string | lower }}"
  loop: "{{ hermes_profile_config_current.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - not ansible_check_mode
    - item.rc == 1 or (item.stdout | trim | lower) != (item.item.value | string | lower)
  register: hermes_profile_config_set

# s6-svstat plutot que `hermes gateway status` : sortie stable et non decoree.
# Lu en root, comme le superviseur.
- name: "Read the gateway supervision state of profile {{ hermes_profile.name }}"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - hermes
      - /command/s6-svstat
      - "/run/service/gateway-{{ hermes_profile.name }}"
  register: hermes_profile_svstat
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: "Start the gateway of profile {{ hermes_profile.name }}"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -u
      - "{{ hermes_puid }}"
      - hermes
      - hermes
      - -p
      - "{{ hermes_profile.name }}"
      - gateway
      - start
  when:
    - not ansible_check_mode
    - hermes_profile_svstat.stdout is not match('^up')
  register: hermes_profile_gateway_started

# .env et config ne sont lus qu'au demarrage du gateway. SOUL.md et scripts/
# n'en ont pas besoin : relus a chaque session et a chaque tache.
- name: "Restart the gateway with its new keys for profile {{ hermes_profile.name }}"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -u
      - "{{ hermes_puid }}"
      - hermes
      - hermes
      - -p
      - "{{ hermes_profile.name }}"
      - gateway
      - restart
  when:
    - not ansible_check_mode
    - hermes_profile_gateway_started is skipped
    - hermes_profile_env_result is changed or hermes_profile_config_set is changed

- name: "Wait for the gateway to listen for profile {{ hermes_profile.name }}"
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ hermes_profile.api_server_port }}"
    timeout: 120
  when: not ansible_check_mode
