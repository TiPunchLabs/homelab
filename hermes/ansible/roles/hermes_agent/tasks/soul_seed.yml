---
# =============================================================================
# SOUL.md : SEME UNE FOIS, puis la propriete de Hermes et de l'utilisateur.
#
# Entrees :
#   hermes_soul_src          : SOUL.md livre (controleur)
#   hermes_soul_dest         : SOUL.md du profil (hote)
#   hermes_soul_stock_sha256 : empreintes du SOUL.md generique de Hermes
#
# Pourquoi pas un simple `copy force: false` : `hermes profile create` ecrit
# DEJA un SOUL.md, le texte generique DEFAULT_SOUL_MD (hermes_cli/profiles.py,
# v0.20.4). force: false ne regarde que l'existence : notre SOUL.md ne serait
# jamais pose. On seme donc si le fichier est ABSENT ou s'il est encore,
# octet pour octet, le texte generique — qui ne porte aucune intention.
#
# Toute autre valeur est une identite vivante (editee depuis le dashboard,
# `PUT /api/profiles/{name}/soul`, ou a la main) : la tache est alors
# sautee, et ni le contenu, ni le mode, ni le proprietaire ne bougent.
#
# Pousser volontairement une nouvelle version du depot : supprimer le
# SOUL.md du profil a la main, puis rejouer. Jamais automatiquement.
# =============================================================================

- name: Read the current SOUL.md of {{ hermes_soul_dest }}
  ansible.builtin.stat:
    path: "{{ hermes_soul_dest }}"
    checksum_algorithm: sha256
  register: hermes_soul_stat

- name: Seed SOUL.md when absent or still the Hermes stock text
  ansible.builtin.copy:
    src: "{{ hermes_soul_src }}"
    dest: "{{ hermes_soul_dest }}"
    owner: "{{ hermes_puid }}"
    group: "{{ hermes_pgid }}"
    mode: '0644'
    force: true
  when: >-
    not hermes_soul_stat.stat.exists
    or hermes_soul_stat.stat.checksum in hermes_soul_stock_sha256
