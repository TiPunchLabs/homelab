# Sources de base de la veille — possedees par Ansible, ecrasees au playbook.
# L'agent ajoute ou desactive des sources dans tech-watch/sources.local.yaml
# (meme schema + `disabled: [noms]`), fusionne a chaque collecte.
#
# kind: github -> releases.atom du depot ; sinon `url` d'un flux RSS ou Atom.
# Les pre-versions GitHub (rc, canary, nightly...) sont ecartees, sauf
# `prereleases: true`. `max` plafonne le nombre d'elements par collecte.
# axis: ia | ia-locale | python | devops | caraibe

sources:
  # --- IA & agents ---------------------------------------------------------
  - { name: "Hermes Agent", kind: github, repo: NousResearch/hermes-agent, axis: ia }
  - { name: "Hugging Face blog", url: "https://huggingface.co/blog/feed.xml", axis: ia }
  - { name: "Simon Willison", url: "https://simonwillison.net/atom/entries/", axis: ia }
  - { name: "MCP spec", kind: github, repo: modelcontextprotocol/modelcontextprotocol, axis: ia }

  # --- IA locale -------------------------------------------------------------
  - { name: "Ollama", kind: github, repo: ollama/ollama, axis: ia-locale, max: 3 }
  - { name: "llama.cpp", kind: github, repo: ggml-org/llama.cpp, axis: ia-locale, max: 2 }  # un build par commit
  - { name: "vLLM", kind: github, repo: vllm-project/vllm, axis: ia-locale }

  # --- Python ----------------------------------------------------------------
  - { name: "Python Insider", url: "https://blog.python.org/feeds/posts/default", axis: python }
  - { name: "uv", kind: github, repo: astral-sh/uv, axis: python }
  - { name: "Ruff", kind: github, repo: astral-sh/ruff, axis: python }
  - { name: "FastAPI", kind: github, repo: fastapi/fastapi, axis: python }
  - { name: "SQLAlchemy", kind: github, repo: sqlalchemy/sqlalchemy, axis: python }

  # --- DevOps & automatisation ----------------------------------------------
  - { name: "Ansible", kind: github, repo: ansible/ansible, axis: devops }
  - { name: "OpenTofu", kind: github, repo: opentofu/opentofu, axis: devops }
  - { name: "Terraform", kind: github, repo: hashicorp/terraform, axis: devops }
  - { name: "Docker Compose", kind: github, repo: docker/compose, axis: devops }
  - { name: "Kubernetes blog", url: "https://kubernetes.io/feed.xml", axis: devops }

  # --- Caraibe ---------------------------------------------------------------
  # Peu de flux dedies : Google News RSS (sans cle) comble le manque. La
  # recherche Tavily sert aux questions ponctuelles depuis le chat.
  - name: "Caraibe tech (EN)"
    url: "https://news.google.com/rss/search?q=Caribbean+%28technology+OR+AI+OR+digital+OR+%22submarine+cable%22+OR+broadband+OR+startup%29+-cruise+-%22Royal+Caribbean%22+when%3A7d&hl=en-US&gl=US&ceid=US%3Aen"
    axis: caraibe
    max: 6
  - name: "Antilles numerique (FR)"
    url: "https://news.google.com/rss/search?q=%28Guadeloupe+OR+Martinique+OR+Antilles+OR+Guyane%29+%28num%C3%A9rique+OR+IA+OR+%22intelligence+artificielle%22+OR+startup+OR+cybers%C3%A9curit%C3%A9+OR+fibre+OR+c%C3%A2ble+OR+data%29+when%3A7d&hl=fr&gl=FR&ceid=FR%3Afr"
    axis: caraibe
    max: 6

# Hacker News : histoires au-dessus d'un seuil de points, filtrees par mots-cles.
hackernews:
  axis: ia
  min_points: 150
  max: 10
  keywords: [llm, ai, agent, gpt, claude, model, python, ansible, terraform, kubernetes, docker, self-host, homelab, ollama, llama]
