---
# Image publiee sur Docker Hub. Le docker-compose.yml du depot amont utilise
# `build: .` parce que c'est le depot source : la doc de deploiement, elle,
# documente l'image publiee. Aucun outillage de build n'est necessaire ici.
hermes_image: "nousresearch/hermes-agent"
# renovate: datasource=docker depName=nousresearch/hermes-agent
hermes_image_tag: "v2026.8.18"

hermes_install_dir: "/opt/hermes"
hermes_data_dir: "/opt/hermes/data"

# Couche "managed scope" de Hermes, montee sur /etc/hermes dans le conteneur.
# Ses cles sont fusionnees PAR-DESSUS celles du volume de donnees et gagnent a
# la FEUILLE : Ansible epingle `model.provider` sans toucher a `model.default`
# ni a `platforms` que l'agent ou ses assistants ecrivent de leur cote.
#
# C'est ce qui donne a Ansible une frontiere par CLE et non par fichier. Avec
# une frontiere par fichier, tout ce qu'un autre ecrivain deposait dans
# config.yaml etait detruit au playbook suivant.
hermes_managed_dir: "/opt/hermes/managed"

# Bundle CA de l'hote, monte dans le conteneur. Rempli par le role
# `internal_ca_trust`, qui doit donc s'executer AVANT ce role.
hermes_ca_bundle: "/etc/ssl/certs/ca-certificates.crt"

# Sondes TLS jouees DEPUIS le conteneur. La premiere prouve que la CA interne
# est vue ; la seconde que le bundle de l'hote n'a pas casse la confiance
# publique — sans quoi l'inference tomberait et l'agent avec.
hermes_ca_verify_internal_url: "https://kandidat.internal/health"
hermes_ca_verify_public_url: "https://api.deepseek.com/"

# Le conteneur tourne en utilisateur `hermes` (UID 10000) via s6-overlay.
# PUID/PGID le remappent sur le proprietaire du volume cote hote, sans quoi
# les fichiers ecrits par l'agent seraient illisibles depuis la VM.
hermes_puid: 1000
hermes_pgid: 1000

hermes_gateway_port: 8642
hermes_dashboard_port: 9119

# Fournisseur d'inference : DeepSeek en direct, via son endpoint compatible
# OpenAI. `key_env` ne porte que le *nom* de la variable — la valeur vit dans
# .env, jamais dans config.yaml.
hermes_provider_name: "deepseek"
hermes_provider_display_name: "DeepSeek"
hermes_provider_base_url: "https://api.deepseek.com/v1"
hermes_provider_key_env: "DEEPSEEK_API_KEY"
hermes_model_default: "deepseek-v4-flash"

# ============================================================
# Plateforme Telegram
# ============================================================
# Deux cles, deux couches :
#
#   TELEGRAM_BOT_TOKEN     .env du VOLUME, un par profil. Jamais en managed :
#                          celle-ci s'applique a TOUS les profils, et un jeton
#                          ne peut appartenir qu'a un seul bot/gateway.
#   TELEGRAM_ALLOWED_USERS couche MANAGED, commune aux cinq bots et
#                          inviolable (root, :ro, chargee en dernier).
#
# Desactivable sans toucher au reste : sans jeton, l'adaptateur ne demarre pas.
hermes_telegram_enabled: true

# Liste blanche d'identifiants Telegram numeriques, separes par des virgules.
# OBLIGATOIRE (validate.yml echoue si elle est vide) : sans elle, le gateway
# retombe sur l'appairage et propose un code a quiconque connait le bot.
hermes_telegram_allowed_users: ""

# Attente bornee de « Telegram connecte » apres deploiement : 24 x 5 s = 2 min.
hermes_telegram_check_retries: 24
hermes_telegram_check_delay: 5

# ============================================================
# Profils supplementaires
# ============================================================
# Chaque profil est une instance Hermes isolee (memoire, sessions, cron, bot
# Telegram) sous {{ hermes_data_dir }}/profiles/<name>, servie par sa propre
# gateway s6 (`gateway-<name>`). Schema :
#
#   - name: cafe-ia                     # [a-z0-9_-], jamais "default"
#     description: "..."                # routage kanban
#     telegram_bot_token: "{{ vault_hermes_cafe_ia_telegram_bot_token }}"
#     api_server_port: 8646             # = hermes_profile_reserved_ports[name]
#     env: { TAVILY_API_KEY: "..." }    # cles .env propres au profil
#     config: { cron.mirror_delivery: true }
#
# PAS de telegram_allowed_users : la liste blanche est globale (managed).
# Jeton obligatoire, unique (default compris) ; validate.yml le verifie sans
# jamais l'afficher.
#
# Contenu livre : files/profiles/<name>/. SOUL.md y est SEME une fois
# (soul_seed.yml) ; le reste (scripts/...) est possede par Ansible.
hermes_profiles: []

# Ports d'API figes par profil, pas par ordre de deploiement. Un profil absent
# de cette table, ou dont le port differe, est refuse.
hermes_profile_reserved_ports: {}

hermes_profiles_src_dir: "{{ role_path }}/files/profiles"

# ============================================================
# Topologie de gateway
# ============================================================
# false : une gateway s6 par profil (Hermes v0.20.4, modele de hermes-30,
# detruite en M6.6.C) — profile.yml.
# true  : UNE gateway multiplexee sert tous les profils (Hermes v0.22, defaut
#         amont « one gateway per machine ») — profile_multiplex.yml. Les slots
#         nommes restent enregistres mais arretes, aucun port d'API par profil
#         n'ecoute, et `hermes -p <name> gateway start` est refuse (exit 78).
# A poser avec l'image : une image v0.22 replie d'office les slots nommes au
# boot (container_boot.py), et le chemin false casserait au premier profil.
hermes_gateway_multiplex: false

# ============================================================
# Identite declaree du profil default (M5 : Nora)
# ============================================================
# Vide = default reste tel qu'il tourne (aucune tache de default_profile.yml).
# Schema :
#
#   soul_predecessor_sha256: "<64 hex>"  # seul SOUL.md en service remplacable
#   env: { TAVILY_API_KEY: "..." }       # cles .env de default, cle par cle
#   config: { web.backend: tavily }      # `hermes -p default config set`
#   config_no_log: []                    # cles dont la valeur reste masquee
#
# Le SOUL.md livre est {{ hermes_default_src_dir }}/SOUL.md. Les changements
# de .env et de config redemarrent la SEULE gateway default (jamais le
# conteneur, donc jamais Kaféine, Néo ni Scout).
hermes_default_profile: {}
hermes_default_src_dir: "{{ role_path }}/files/default"

# ============================================================
# M5 : preflight, sauvegarde et rollback du passage a Nora
# ============================================================
# Jamais joues par deploy.yml : m5-preflight.yml (lecture seule),
# m5-backup.yml (-e hermes_m5_backup_id=...), m5-rollback.yml (-e
# hermes_m5_backup_id=... -e "hermes_m5_rollback_confirm=ROLLBACK <id>").
#
# Une sauvegarde par identifiant, sous ce repertoire (root, 0700), hors du
# volume monte : le conteneur ne la voit pas. Jamais ecrasee, jamais purgee
# automatiquement (retention : decision humaine).
hermes_m5_backup_root: /root/hermes-m5-backup
# Fichiers de default copies un par un (avec mode, proprietaire, sha256) :
# ce sont eux que le rollback restaure. .env n'est restaure que cle par cle.
hermes_m5_identity_files:
  - SOUL.md
  - memories/USER.md
  - memories/MEMORY.md
  - config.yaml
  - .env
# Cles de .env que M5 ajoute (hermes_default_nora.env) : le rollback les
# remet a leur valeur d'avant, ou les retire si elles n'existaient pas.
hermes_m5_rollback_env_keys:
  - TAVILY_API_KEY
# Archive complete du volume de default, HORS profils (M5 n'y ecrit pas) et
# hors bases SQLite vivantes (copiees a part, de facon coherente). Caches
# regenerables exclus : ~2 Gio sur 2,4 (releve du 2026-10-24).
hermes_m5_tar_excludes:
  - ./profiles
  - "*.db"
  - "*.db-wal"
  - "*.db-shm"
  - "*.db-journal"
  - ./.cache
  - ./home/.cache
  - ./home/.npm
  - ./.pw-browsers
  - ./lazy-packages
  - ./.venv-browser
  - ./.venv-docs
# Les bases sont lues sous l'UID de l'agent : si SQLite doit creer un -shm
# ou un -wal, il appartient a Hermes, jamais a root (un -shm root bloquerait
# la gateway). Les tests remplacent ce prefixe.
hermes_m5_db_reader: ["setpriv", "--reuid={{ hermes_puid }}", "--regid={{ hermes_pgid }}", "--clear-groups"]
# Seuils du preflight M5 : MiB disponibles (M5.2 H.A), espace libre pour la
# sauvegarde, remplissage maximal du disque.
hermes_m5_min_available_mib: 1200
hermes_m5_min_free_mib: 4096
hermes_m5_max_disk_pcent: 70
# Profils dont la gateway doit rester intacte autour de M5.
hermes_m5_gateways: [default, cafe-ia, tech-watch, job-search]
# Archive des fichiers historiques deplaces en M5.4 (contrat du rollback) :
# <dir>/<id>/manifest.json {"items": [chemins relatifs]} et <dir>/<id>/data/<chemin>.
hermes_m5_archive_root: /opt/hermes/archive
hermes_meminfo_path: /proc/meminfo

# ============================================================
# Preflight, sauvegarde et rollback du deploiement M1
# ============================================================
# Fenetre de securite cron (minutes) : aucun job ne doit etre du dans ce
# delai, ni en retard, ni en cours, au moment du redemarrage (preflight.yml).
hermes_restart_safety_window_minutes: 120

# Sauvegarde ponctuelle prise avant M1 (m1_backup.yml), lue par
# m1_rollback.yml. Sur l'hote, sous /root (0700), jamais rapatriee.
hermes_m1_backup_dir: "/root/hermes-m1-backup"
hermes_m1_backup_files:
  - { src: "{{ hermes_managed_dir }}/.env", dest: managed.env }
  - { src: "{{ hermes_managed_dir }}/config.yaml", dest: managed.config.yaml }
  - { src: "{{ hermes_install_dir }}/docker-compose.yml", dest: docker-compose.yml }
  - { src: "{{ hermes_data_dir }}/.env", dest: data.env }
  - { src: "{{ hermes_data_dir }}/config.yaml", dest: data.config.yaml }
  - { src: "{{ hermes_data_dir }}/cron/jobs.json", dest: jobs.json }

# Proprietaire des fichiers managed restaures (root en production).
hermes_managed_owner: root
# Le rollback redemarre la stack une fois si un fichier a change, puis
# controle Telegram (niveaux 1-3).
hermes_m1_rollback_restart: true

# ============================================================
# Preflight memoire d'une gateway supplementaire (M2)
# ============================================================
# MiB disponibles exiges AVANT de demarrer une gateway, a l'instant ET au
# plancher du ballooning Proxmox (memory_preflight.yml). 1,5 Gio : la VM n'a
# pas de swap, une gateway pese ~350 Mo, il reste ~1,15 Gio apres.
hermes_pf_min_available_mib: 1536
hermes_pf_meminfo_path: /proc/meminfo
# Nom de la VM dans Proxmox (cluster/resources) : celui de l'inventaire.
hermes_pf_pve_vm_name: "{{ inventory_hostname }}"

hermes_dashboard_username: "admin"
hermes_dashboard_public_url: "https://hermes.internal"

# Plafonds de ressources : un agent parti en boucle ne doit pas emporter la VM.
hermes_memory_limit: "4G"
hermes_cpu_limit: "2.0"

# Arret propre de la gateway (M6.5.A.1). A l'arret du conteneur, s6-overlay
# envoie SIGTERM a tous les processus puis SIGKILL apres S6_KILL_GRACETIME
# (3000 ms par defaut). Or la gateway v0.22.5 deconnecte ses adaptateurs l'un
# apres l'autre, jusqu'a 5 s chacun : 4,41 s mesurees avec trois bots, d'ou un
# SIGKILL avant le tampon de fin propre et un « exited UNCLEANLY » au boot.
# 20 s couvrent quatre bots au plafond de 5 s. Docker doit attendre PLUS que
# s6, sinon son propre SIGKILL (10 s par defaut) devient la nouvelle limite.
hermes_s6_kill_gracetime_ms: 20000
hermes_stop_grace_period: "30s"
