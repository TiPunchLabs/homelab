---
# Image publiee sur Docker Hub. Le docker-compose.yml du depot amont utilise
# `build: .` parce que c'est le depot source : la doc de deploiement, elle,
# documente l'image publiee. Aucun outillage de build n'est necessaire ici.
hermes_image: "nousresearch/hermes-agent"
# renovate: datasource=docker depName=nousresearch/hermes-agent
hermes_image_tag: "v2026.8.18"

hermes_install_dir: "/opt/hermes"
hermes_data_dir: "/opt/hermes/data"

# Couche "managed scope" de Hermes, montee sur /etc/hermes dans le conteneur.
# Ses cles sont fusionnees PAR-DESSUS celles du volume de donnees et gagnent a
# la FEUILLE : Ansible epingle `model.provider` sans toucher a `model.default`
# ni a `platforms` que l'agent ou ses assistants ecrivent de leur cote.
#
# C'est ce qui donne a Ansible une frontiere par CLE et non par fichier. Avec
# une frontiere par fichier, tout ce qu'un autre ecrivain deposait dans
# config.yaml etait detruit au playbook suivant.
hermes_managed_dir: "/opt/hermes/managed"

# Bundle CA de l'hote, monte dans le conteneur. Rempli par le role
# `internal_ca_trust`, qui doit donc s'executer AVANT ce role.
hermes_ca_bundle: "/etc/ssl/certs/ca-certificates.crt"

# Sondes TLS jouees DEPUIS le conteneur. La premiere prouve que la CA interne
# est vue ; la seconde que le bundle de l'hote n'a pas casse la confiance
# publique — sans quoi l'inference tomberait et l'agent avec.
hermes_ca_verify_internal_url: "https://kandidat.internal/health"
hermes_ca_verify_public_url: "https://api.deepseek.com/"

# Le conteneur tourne en utilisateur `hermes` (UID 10000) via s6-overlay.
# PUID/PGID le remappent sur le proprietaire du volume cote hote, sans quoi
# les fichiers ecrits par l'agent seraient illisibles depuis la VM.
hermes_puid: 1000
hermes_pgid: 1000

hermes_gateway_port: 8642
hermes_dashboard_port: 9119

# Fournisseur d'inference : DeepSeek en direct, via son endpoint compatible
# OpenAI. `key_env` ne porte que le *nom* de la variable — la valeur vit dans
# .env, jamais dans config.yaml.
hermes_provider_name: "deepseek"
hermes_provider_display_name: "DeepSeek"
hermes_provider_base_url: "https://api.deepseek.com/v1"
hermes_provider_key_env: "DEEPSEEK_API_KEY"
hermes_model_default: "deepseek-v4-flash"

# ============================================================
# Plateforme Telegram
# ============================================================
# Deux cles, deux couches :
#
#   TELEGRAM_BOT_TOKEN     .env du VOLUME, un par profil. Jamais en managed :
#                          celle-ci s'applique a TOUS les profils, et un jeton
#                          ne peut appartenir qu'a un seul bot/gateway.
#   TELEGRAM_ALLOWED_USERS couche MANAGED, commune aux cinq bots et
#                          inviolable (root, :ro, chargee en dernier).
#
# Desactivable sans toucher au reste : sans jeton, l'adaptateur ne demarre pas.
hermes_telegram_enabled: true

# Liste blanche d'identifiants Telegram numeriques, separes par des virgules.
# OBLIGATOIRE (validate.yml echoue si elle est vide) : sans elle, le gateway
# retombe sur l'appairage et propose un code a quiconque connait le bot.
hermes_telegram_allowed_users: ""

# Attente bornee de « Telegram connecte » apres deploiement : 24 x 5 s = 2 min.
hermes_telegram_check_retries: 24
hermes_telegram_check_delay: 5

# ============================================================
# Profils supplementaires
# ============================================================
# Chaque profil est une instance Hermes isolee (memoire, sessions, cron, bot
# Telegram) sous {{ hermes_data_dir }}/profiles/<name>, servie par sa propre
# gateway s6 (`gateway-<name>`). Schema :
#
#   - name: tech-watch                  # [a-z0-9_-], jamais "default"
#     description: "..."                # routage kanban
#     telegram_bot_token: "{{ vault_hermes_tech_watch_telegram_bot_token }}"
#     api_server_port: 8643             # = hermes_profile_reserved_ports[name]
#     env: { TAVILY_API_KEY: "..." }    # cles .env propres au profil
#     config: { cron.mirror_delivery: true }
#
# PAS de telegram_allowed_users : la liste blanche est globale (managed).
# Jeton obligatoire, unique (default compris) ; validate.yml le verifie sans
# jamais l'afficher.
#
# Contenu livre : files/profiles/<name>/. SOUL.md y est SEME une fois
# (soul_seed.yml) ; le reste (scripts/...) est possede par Ansible.
hermes_profiles: []

# Ports d'API figes par profil, pas par ordre de deploiement. Un profil absent
# de cette table, ou dont le port differe, est refuse.
hermes_profile_reserved_ports: {}

hermes_profiles_src_dir: "{{ role_path }}/files/profiles"

hermes_dashboard_username: "admin"
hermes_dashboard_public_url: "https://hermes.internal"

# Plafonds de ressources : un agent parti en boucle ne doit pas emporter la VM.
hermes_memory_limit: "4G"
hermes_cpu_limit: "2.0"
