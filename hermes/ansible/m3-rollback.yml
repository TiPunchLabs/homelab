---
# Rollback M3 : arrete Néo (tech-watch) et l'empeche de repartir. Ne supprime
# rien, ne touche ni a default ni a cafe-ia, ne redemarre pas le conteneur.
#   ansible-playbook ansible/m3-rollback.yml
# Puis retirer tech-watch de hermes_profiles (git revert du commit
# d'activation) et rejouer deploy.yml --tags hermes : changed=0 attendu.
- name: Rollback M3 de hermes-30 — arret du profil tech-watch
  hosts: hermes
  become: true
  gather_facts: false
  tasks:
    - name: Run profile_rollback.yml for tech-watch
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: profile_rollback.yml
      vars:
        hermes_rb_profile_name: tech-watch

    # profile_rollback.yml ne recontrole que default : les autres profils
    # supplementaires (cafe-ia) doivent eux aussi etre restes connectes.
    - name: Run profile_telegram_check.yml for every other deployed profile
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: profile_telegram_check.yml
      loop: "{{ hermes_profiles | map(attribute='name') | reject('eq', 'tech-watch') | list }}"
      loop_control:
        loop_var: hermes_tc_profile_name
