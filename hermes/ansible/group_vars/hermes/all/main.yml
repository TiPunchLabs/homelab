# ============================================================
# 🕒 Systeme
# ============================================================
# Hermes planifie ses taches en heure locale, pas en UTC.
hermes_timezone: America/Guadeloupe

# ============================================================
# 🔐 Securite - Role security_hardening
# ============================================================
security_ssh_hardening: true
security_allow_users: "ansible"
security_disable_root_login: true

security_enable_ufw: true
security_ufw_default_incoming: "deny"
# Sortant en allow : l'inference part vers api.deepseek.com en HTTPS,
# aucune regle sortante dediee n'est necessaire.
security_ufw_default_outgoing: "allow"

# `src` restreint la regle a une source unique. Le dashboard Hermes n'est
# joignable que par le reverse proxy : l'ouvrir a tout le LAN annulerait
# l'interet de passer par Caddy (TLS + authentification centralisee).
security_open_ports:
  - { port: 22, proto: tcp, comment: "SSH access" }
  - { port: 9119, proto: tcp, src: "{{ hermes_caddy_ip }}", comment: "Hermes dashboard via Caddy" }

# ============================================================
# 🐳 Docker - Role docker
# ============================================================
# Rotation des journaux : le driver json-file par defaut ne borne ni la taille
# ni le nombre de fichiers. Hermes tourne 24/7 avec sessions et sous-agents ;
# sans plafond, / se remplit sans le moindre avertissement.
# 10m x 3 = 30 Mo au maximum par conteneur.
docker_log_max_size: "10m"
docker_log_max_file: "3"

# Pas de cle "dns" dans daemon.json : la stack Hermes tourne en
# network_mode: host (docker-compose.yml amont), donc les conteneurs partagent
# la pile reseau de l'hote et resolvent .internal via son propre resolveur.

# ============================================================
# 🤖 Hermes Agent - Role hermes_agent
# ============================================================
# Reverse proxy autorise a joindre le dashboard (LXC caddy-70).
hermes_caddy_ip: "192.168.10.70"

# Modele de depart : `deepseek-v4-flash` plutot que `deepseek-v4-pro`. On ne
# sait pas encore ce que cet agent fait reellement — volume d'appels, longueur
# des chaines d'outils, qualite suffisante ou non. `flash` donne une ligne de
# base ; basculer ensuite ne coute qu'un replay du playbook, sans nouvelle cle
# ni nouvelle image.
hermes_model_default: "deepseek-v4-flash"

# Secrets — valeurs reelles dans group_vars/hermes/vault/config.yml
hermes_deepseek_api_key: "{{ vault_hermes_deepseek_api_key }}"
hermes_api_server_key: "{{ vault_hermes_api_server_key }}"
hermes_dashboard_password: "{{ vault_hermes_dashboard_password }}"
hermes_dashboard_secret: "{{ vault_hermes_dashboard_secret }}"

# ============================================================
# 📱 Telegram - Role hermes_agent
# ============================================================
# Identifiant Telegram autorise, pose dans la couche MANAGED : il vaut pour les
# bots de tous les profils. Ce n'est pas un secret — c'est un identifiant
# public, et le garder en clair rend la liste blanche auditable.
# Releve dans agent.log le 2026-08-24 : « [Telegram] Sending response to 8854358938 ».
hermes_telegram_allowed_users: "8854358938"

# Jeton BotFather du profil default — valeur reelle dans
# group_vars/hermes/vault/config.yml. Deploye dans /opt/hermes/data/.env,
# PLUS dans la couche managed.
hermes_telegram_bot_token: "{{ vault_hermes_telegram_bot_token }}"

# ============================================================
# 🧬 Profils supplementaires - Role hermes_agent
# ============================================================
# Un profil = une gateway s6, un bot Telegram, un port d'API, dans le meme
# conteneur. Contenu livre : roles/hermes_agent/files/profiles/<name>/.
#
# ⚠️ La liste est declaree ici, explicitement, et non par la valeur par
# defaut du role. Chaque profil y entre lors de la phase de deploiement de SA
# mission (M2 cafe-ia, M3 tech-watch, M4 job-search ; M5 fait evoluer default
# en Maya, sans nouveau profil), une fois son jeton au vault, par un commit
# dedie : le revert de ce commit est le rollback declaratif (apres
# m<N>-rollback.yml).
hermes_profiles:
  - "{{ hermes_profile_cafe_ia }}"
  - "{{ hermes_profile_tech_watch }}"
  - "{{ hermes_profile_job_search }}"

# Ports figes par profil (default = hermes_gateway_port, 8642). API en
# 127.0.0.1 : rien a ouvrir en UFW, rien a changer dans Caddy.
hermes_profile_reserved_ports:
  tech-watch: 8643
  daily-life: 8644
  job-search: 8645
  cafe-ia: 8646

# Néo — veille technique. Preparee en M3.2, activee en M3.3 (2026-10-21) par
# son entree dans hermes_profiles.
#
# Prerequis M3.3 (poses le 2026-10-21) :
#   - hermes_tech_watch_telegram_bot_username : nom du bot NEUF cree dans
#     BotFather (D2 : neo_<6 alphanum>_bot). `mandatory` reste indispensable :
#     une simple reference a une variable indefinie serait vue comme
#     « telegram_bot_username non defini », que validate.yml accepte et qui
#     fait SAUTER le controle getMe de profile.yml ;
#   - vault_hermes_tech_watch_telegram_bot_token : jeton de Néo (remplace
#     celui de l'ancien bot « veille », qui n'est supprime dans BotFather
#     qu'apres validation de Néo).
#
# Outils : meme matrice que Kaféine (D5) — recherche et lecture web, memoire,
# skills sous approbation. Ni terminal, ni fichiers, ni cron, ni MCP. Les
# scripts de collecte livres (files/profiles/tech-watch/scripts/) restent
# INACTIFS : aucun cron ne les appelle et Néo ne peut pas en creer.
hermes_tech_watch_telegram_bot_username: neo_r64gnb_bot
hermes_profile_tech_watch:
  name: tech-watch
  description: "Néo — veille technique : IA et agents, IA locale, DevOps et cloud, développement, open source."
  telegram_bot_username: >-
    {{ hermes_tech_watch_telegram_bot_username
       | mandatory('PREREQUIS M3.3 : definir hermes_tech_watch_telegram_bot_username (bot BotFather de Neo)') }}
  telegram_bot_token: "{{ vault_hermes_tech_watch_telegram_bot_token }}"
  api_server_port: 8643
  env:
    # Cle Tavily dediee : jamais celle de Kaféine. Sans elle, aucun backend
    # web dans l'image (ddgs absent, lazy installs coupes).
    TAVILY_API_KEY: "{{ vault_hermes_tech_watch_tavily_api_key }}"
  config:
    web.backend: tavily
    # Liste blanche par plateforme ; `no_mcp` exclut tout serveur MCP.
    platform_toolsets.telegram: &hermes_tech_watch_toolsets
      - web
      - skills
      - memory
      - session_search
      - todo
      - clarify
      - no_mcp
    platform_toolsets.cron: *hermes_tech_watch_toolsets
    platform_toolsets.api_server: *hermes_tech_watch_toolsets
    platform_toolsets.cli: *hermes_tech_watch_toolsets
    # `skills` est indivisible (skill_manage inclus) : toute ecriture de skill
    # attend `/skills approve <id>`. Voir la section Kaféine du README du role.
    skills.write_approval: true
    # Liste noire appliquee EN DERNIER, sur toutes les plateformes (cli
    # comprise). Meme liste que Kaféine, verifiee sur l'image v2026.8.18.
    # `browser` n'y figure PAS : sur v2026.8.18 ce toolset embarque `web_search`
    # (toolsets.py) et la liste noire est soustraite outil par outil, en
    # dernier : elle retirait web_search et laissait web_extract. Les
    # browser_* restent hors des listes blanches des QUATRE plateformes (sans
    # platform_toolsets.cli, la cli retomberait sur les toolsets par defaut,
    # browser compris) ; le controle `toolsets` de profile.yml verifie toolset
    # ET outil par outil ce que le modele recoit.
    agent.disabled_toolsets:
      - terminal
      - file
      - code_execution
      - computer_use
      - delegation
      - cronjob
      - kanban
      - homeassistant
      - image_gen
      - video
      - video_gen
      - bfl
      - tts
      - x_search
      - vision
      - spotify
      - discord
      - discord_admin
      - yuanbao
      - feishu_doc
      - feishu_drive
      - desktop_ui
      - project
    # Contexte technique de l'utilisateur. Hermes l'ajoute a la partie stable
    # du prompt systeme (prompt_builder.build_environment_hints), lu dans le
    # config.yaml DU PROFIL : present des la premiere conversation, sans
    # toolset file, sans toucher a la memoire. Une modification ici est
    # reappliquee par `hermes config set` au playbook suivant, puis la gateway
    # redemarre (profile.yml). Aucun secret, aucune adresse, aucun identifiant.
    agent.environment_hint: |-
      Contexte technique de Xavier (stable, déclaratif ; ni temps réel, ni exhaustif) :
      - Station de travail : Lenovo LOQ 15ARP9, AMD Ryzen 7 7435HS (8 cœurs / 16 threads), 32 Go de RAM DDR5, GPU NVIDIA RTX 4060 Laptop 8 Go de VRAM, Ubuntu 24.04 LTS. Usages : développement, IA locale, agents de code, expérimentation LLM, Docker. C'est la seule machine avec un GPU.
      - HomeLab : hyperviseur Proxmox VE, 16 Go de RAM physique au total, sans GPU. VM et services : Hermes, un hôte Docker (dockhost), un cluster Kubernetes, des services réseau et DNS. Outils : Proxmox, Docker, Kubernetes, Helm, Ansible, Terraform, GitLab CI, Komodo, GitOps.
      - IA locale utilisée ou testée : Ollama, Open WebUI, modèles locaux, embeddings, agents de code.
      - Projets : HomeLab, FlowForge, expérimentations RAG, applications Python, agents IA, IA locale.
      Ces informations servent à contextualiser la veille ; elles n'ouvrent aucun accès aux machines ni aux projets. Elles peuvent être datées : ne les présente pas comme des mesures actuelles.

# Kaféine — Café IA (veille IA grand public, preparation des rencontres).
# DEPLOYE le 2026-10-20 (M2), active par le commit e07b385. Ses deux cles
# vault sont obligatoires : si l'une manque, la declaration ne se resout pas et
# le playbook echoue avant toute ecriture.
#
# Outils (D5) : recherche et lecture web, memoire, skills, rien d'autre. Ni
# terminal, ni fichiers, ni navigateur, ni cron, ni MCP (donc pas Kandidat).
# Matrice et justifications : roles/hermes_agent/README.md, section Kaféine.
hermes_profile_cafe_ia:
  name: cafe-ia
  description: "Kaféine — veille IA, projets à présenter et préparation des rencontres Café IA."
  # Propose, a confirmer dans BotFather (code aleatoire, pas une securite).
  # Verifie par getMe avant tout demarrage du gateway.
  telegram_bot_username: kafeine_r64gnb_bot
  telegram_bot_token: "{{ vault_hermes_cafe_ia_telegram_bot_token }}"
  api_server_port: 8646
  env:
    # Aucun backend web dans l'image sans cle (ddgs absent, lazy installs
    # coupes) : sans elle, Kaféine ne pourrait pas chercher.
    TAVILY_API_KEY: "{{ vault_hermes_cafe_ia_tavily_api_key }}"
  config:
    web.backend: tavily
    # Liste blanche par plateforme ; `no_mcp` exclut tout serveur MCP.
    platform_toolsets.telegram: &hermes_cafe_ia_toolsets
      - web
      - skills
      - memory
      - session_search
      - todo
      - clarify
      - no_mcp
    platform_toolsets.cron: *hermes_cafe_ia_toolsets
    platform_toolsets.api_server: *hermes_cafe_ia_toolsets
    platform_toolsets.cli: *hermes_cafe_ia_toolsets
    # Le toolset `skills` est indivisible (skills_list, skill_view et
    # skill_manage) : impossible de retirer skill_manage seul. Ce verrou met
    # en attente toute ecriture de skill (create, edit, patch, delete,
    # write_file, remove_file), revue background comprise, jusqu'a
    # `/skills approve <id>`. Lecture des skills inchangee.
    skills.write_approval: true
    # Liste noire appliquee EN DERNIER par Hermes, sur toutes les plateformes
    # (cli comprise) : le vrai verrou si une liste blanche venait a s'elargir.
    # `browser` n'y figure PAS : sur v2026.8.18 ce toolset embarque `web_search`
    # (toolsets.py) et la liste noire est soustraite outil par outil, en
    # dernier : elle retirait web_search et laissait web_extract. Les
    # browser_* restent hors des listes blanches des QUATRE plateformes (sans
    # platform_toolsets.cli, la cli retomberait sur les toolsets par defaut,
    # browser compris) ; le controle `toolsets` de profile.yml verifie toolset
    # ET outil par outil ce que le modele recoit.
    agent.disabled_toolsets:
      - terminal
      - file
      - code_execution
      - computer_use
      - delegation
      - cronjob
      - kanban
      - homeassistant
      - image_gen
      - video
      - video_gen
      - bfl
      - tts
      - x_search
      - vision
      - spotify
      - discord
      - discord_admin
      - yuanbao
      - feishu_doc
      - feishu_drive
      - desktop_ui
      - project

# Scout — recherche d'emploi et accompagnement professionnel. Prepare en M4.2,
# active en M4.3 (2026-10-24) par son entree dans hermes_profiles.
#
# Prerequis M4.3 (poses le 2026-10-22) :
#   - bot BotFather scout_r64gnb_bot (D2), nom confirme le 2026-10-22 ;
#   - vault_hermes_job_search_telegram_bot_token : jeton de ce bot ;
#   - vault_hermes_job_search_tavily_api_key : cle Tavily DEDIEE, limite
#     mensuelle posee cote Tavily ;
#   - vault_hermes_job_search_environment_hint : contexte professionnel PRIVE
#     (le depot est public). Procedure : roles/hermes_agent/README.md, Scout.
#
# Outils : meme matrice que Kaféine et Néo (D5, M3.3.1). Ni terminal, ni
# fichiers, ni navigateur, ni cronjob, ni MCP (donc pas Kandidat). Les crons
# emploi seront crees par l'operateur en M4.4 (cron-drafts/job-search.yml).
hermes_profile_job_search:
  name: job-search
  description: "Scout — recherche d'emploi, analyse d'offres et accompagnement professionnel."
  # Verifie par getMe avant tout demarrage du gateway.
  telegram_bot_username: scout_r64gnb_bot
  telegram_bot_token: "{{ vault_hermes_job_search_telegram_bot_token }}"
  api_server_port: 8645
  env:
    # Cle Tavily dediee : jamais celle de Kaféine ni de Néo.
    TAVILY_API_KEY: "{{ vault_hermes_job_search_tavily_api_key }}"
  # Cles de config dont la valeur ne doit jamais apparaitre dans une sortie
  # Ansible (lecture et `config set` en no_log, profile.yml).
  config_no_log:
    - agent.environment_hint
  config:
    web.backend: tavily
    platform_toolsets.telegram: &hermes_job_search_toolsets
      - web
      - skills
      - memory
      - session_search
      - todo
      - clarify
      - no_mcp
    platform_toolsets.cron: *hermes_job_search_toolsets
    platform_toolsets.api_server: *hermes_job_search_toolsets
    platform_toolsets.cli: *hermes_job_search_toolsets
    skills.write_approval: true
    # Meme liste que Kaféine et Néo : `browser` n'y figure PAS (il embarque
    # web_search sur v2026.8.18, cf. M3.3.1) et reste hors des quatre listes
    # blanches.
    agent.disabled_toolsets:
      - terminal
      - file
      - code_execution
      - computer_use
      - delegation
      - cronjob
      - kanban
      - homeassistant
      - image_gen
      - video
      - video_gen
      - bfl
      - tts
      - x_search
      - vision
      - spotify
      - discord
      - discord_admin
      - yuanbao
      - feishu_doc
      - feishu_drive
      - desktop_ui
      - project
    # Meme mecanisme que Néo (prompt systeme stable, config.yaml DU PROFIL),
    # mais valeur chiffree : parcours, competences et criteres de recherche
    # sont des donnees personnelles.
    agent.environment_hint: >-
      {{ vault_hermes_job_search_environment_hint
         | mandatory('PREREQUIS M4.3 : definir vault_hermes_job_search_environment_hint (contexte professionnel de Scout)') }}

# ============================================================
# 👁️ Komodo Periphery - Role komodo_periphery
# ============================================================
# hermes-30 rejoint le Core de dockhost-90 en OBSERVATEUR. La connexion est
# sortante (Periphery appelle Core) : aucune regle UFW a ajouter.
komodo_core_address: "ws://192.168.10.90:9120"
komodo_connect_as: "hermes-30"

# Lecture seule : Komodo voit la stack Hermes, il ne peut pas la piloter.
# Le deploiement reste la propriete exclusive du role hermes_agent.
komodo_periphery_docker_socket_mode: "ro"

# Secret — valeur reelle dans group_vars/hermes/vault/config.yml.
# ⚠️ Cle a USAGE UNIQUE, consommee au premier contact. Voir le README du role
# komodo_periphery pour la procedure de re-onboarding.
komodo_onboarding_key: "{{ vault_komodo_onboarding_key }}"
