# ============================================================
# 🕒 Systeme
# ============================================================
# Hermes planifie ses taches en heure locale, pas en UTC.
hermes_timezone: America/Guadeloupe

# ============================================================
# 🔐 Securite - Role security_hardening
# ============================================================
security_ssh_hardening: true
security_allow_users: "ansible"
security_disable_root_login: true

security_enable_ufw: true
security_ufw_default_incoming: "deny"
# Sortant en allow : l'inference part vers api.deepseek.com en HTTPS,
# aucune regle sortante dediee n'est necessaire.
security_ufw_default_outgoing: "allow"

# `src` restreint la regle a une source unique. Le dashboard Hermes n'est
# joignable que par le reverse proxy : l'ouvrir a tout le LAN annulerait
# l'interet de passer par Caddy (TLS + authentification centralisee).
security_open_ports:
  - { port: 22, proto: tcp, comment: "SSH access" }
  - { port: 9119, proto: tcp, src: "{{ hermes_caddy_ip }}", comment: "Hermes dashboard via Caddy" }

# ============================================================
# 🐳 Docker - Role docker
# ============================================================
# Rotation des journaux : le driver json-file par defaut ne borne ni la taille
# ni le nombre de fichiers. Hermes tourne 24/7 avec sessions et sous-agents ;
# sans plafond, / se remplit sans le moindre avertissement.
# 10m x 3 = 30 Mo au maximum par conteneur.
docker_log_max_size: "10m"
docker_log_max_file: "3"

# Pas de cle "dns" dans daemon.json : la stack Hermes tourne en
# network_mode: host (docker-compose.yml amont), donc les conteneurs partagent
# la pile reseau de l'hote et resolvent .internal via son propre resolveur.

# ============================================================
# 🤖 Hermes Agent - Role hermes_agent
# ============================================================
# Reverse proxy autorise a joindre le dashboard (LXC caddy-70).
hermes_caddy_ip: "192.168.10.70"

# Modele de depart : `deepseek-v4-flash` plutot que `deepseek-v4-pro`. On ne
# sait pas encore ce que cet agent fait reellement — volume d'appels, longueur
# des chaines d'outils, qualite suffisante ou non. `flash` donne une ligne de
# base ; basculer ensuite ne coute qu'un replay du playbook, sans nouvelle cle
# ni nouvelle image.
hermes_model_default: "deepseek-v4-flash"

# Secrets — valeurs reelles dans group_vars/hermes/vault/config.yml
hermes_deepseek_api_key: "{{ vault_hermes_deepseek_api_key }}"
hermes_api_server_key: "{{ vault_hermes_api_server_key }}"
hermes_dashboard_password: "{{ vault_hermes_dashboard_password }}"
hermes_dashboard_secret: "{{ vault_hermes_dashboard_secret }}"

# ============================================================
# 📱 Telegram - Role hermes_agent
# ============================================================
# Identifiant Telegram autorise. Ce n'est pas un secret — c'est un identifiant
# public, et le garder en clair rend la liste blanche auditable.
# Releve dans agent.log le 2026-08-24 : « [Telegram] Sending response to 8854358938 ».
hermes_telegram_allowed_users: "8854358938"

# Jeton BotFather — valeur reelle dans group_vars/hermes/vault/config.yml.
hermes_telegram_bot_token: "{{ vault_hermes_telegram_bot_token }}"

# ============================================================
# 👁️ Komodo Periphery - Role komodo_periphery
# ============================================================
# hermes-30 rejoint le Core de dockhost-90 en OBSERVATEUR. La connexion est
# sortante (Periphery appelle Core) : aucune regle UFW a ajouter.
komodo_core_address: "ws://192.168.10.90:9120"
komodo_connect_as: "hermes-30"

# Lecture seule : Komodo voit la stack Hermes, il ne peut pas la piloter.
# Le deploiement reste la propriete exclusive du role hermes_agent.
komodo_periphery_docker_socket_mode: "ro"

# Secret — valeur reelle dans group_vars/hermes/vault/config.yml.
# ⚠️ Cle a USAGE UNIQUE, consommee au premier contact. Voir le README du role
# komodo_periphery pour la procedure de re-onboarding.
komodo_onboarding_key: "{{ vault_komodo_onboarding_key }}"
